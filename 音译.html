const q=document.getElementById('q'),list=document.getElementById('list'),chips=document.getElementById('chips');
const HOT=["谢谢","多少钱","危险","停","救命","你好","再见","水","吃饭","医院","加油","老板"];
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function hl(t,kw){t=String(t||'');if(!kw)return esc(t);const i=t.toLowerCase().indexOf(kw.toLowerCase());if(i<0)return esc(t);return esc(t.slice(0,i))+'<span class="hit">'+esc(t.slice(i,i+kw.length))+'</span>'+esc(t.slice(i+kw.length));}
function copyText(t,b){const d=()=>{const o=b.textContent;b.textContent="已复制";setTimeout(()=>b.textContent=o,900);};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(d).catch(()=>{fb(t);d();});}else{fb(t);d();}}
function fb(t){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}document.body.removeChild(ta);}
function render(kw){kw=(kw||'').trim();if(!kw){list.innerHTML='<div class="empty">输入关键词开始搜索，或点上方常用词</div>';return;}const k=kw.toLowerCase();const hits=DATA.filter(r=>['category','cn','sw','fr','note'].some(f=>String(r[f]||'').toLowerCase().includes(k))).slice(0,60);if(!hits.length){list.innerHTML='<div class="empty">没有找到「'+esc(kw)+'」</div>';return;}list.innerHTML=hits.map(r=>'<div class="card"><div class="tag">'+esc(r.category)+' · 编号 '+esc(r.id)+'</div><div class="cn">'+hl(r.cn,kw)+'</div><div class="row"><span class="lbl">斯语</span><span class="val">'+hl(r.sw,kw)+'</span><button class="cp" data-cp="'+esc(r.sw)+'">复制</button></div><div class="row"><span class="lbl">法语</span><span class="val">'+hl(r.fr,kw)+'</span><button class="cp" data-cp="'+esc(r.fr)+'">复制</button></div>'+(r.note?'<div class="note">备注：'+esc(r.note)+'</div>':'')+'</div>').join('');list.querySelectorAll('.cp').forEach(b=>b.addEventListener('click',()=>copyText(b.getAttribute('data-cp'),b)));}
chips.innerHTML=HOT.map(w=>'<button class="chip" data-w="'+esc(w)+'">'+esc(w)+'</button>').join('');
chips.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{q.value=b.getAttribute('data-w');render(q.value);window.scrollTo({top:0,behavior:'smooth'});}));
q.addEventListener('input',e=>render(e.target.value));render('');
